name: Import daily literary cat images - Jeoffry 2026-09-13

on:
  push:
    paths:
      - '.github/workflows/import-daily-images-2026-09-13-jeoffry.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download locked reference images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/jeoffry

          download_image() {
            local url="$1"
            local stem="$2"
            local referer="$3"
            local tmp="/tmp/${stem}.download"
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent 'Mozilla/5.0 (compatible; literary-cats-image-import/1.0)' \
              --referer "$referer" \
              "$url" -o "$tmp"
            test -s "$tmp"
            local mime
            mime="$(file -b --mime-type "$tmp")"
            case "$mime" in
              image/jpeg) ext="jpg" ;;
              image/png)  ext="png" ;;
              image/webp) ext="webp" ;;
              image/gif)  ext="gif" ;;
              *) echo "Unsupported MIME type for ${stem}: ${mime}" >&2; exit 1 ;;
            esac
            rm -f "assets/jeoffry/${stem}.jpg" "assets/jeoffry/${stem}.jpeg" "assets/jeoffry/${stem}.png" "assets/jeoffry/${stem}.webp" "assets/jeoffry/${stem}.gif"
            mv "$tmp" "assets/jeoffry/${stem}.${ext}"
            echo "${stem}: $(file -b "assets/jeoffry/${stem}.${ext}")"
            echo "${stem} bytes: $(wc -c < "assets/jeoffry/${stem}.${ext}")"
          }

          download_image 'https://www.101bananas.com/poems/graphics/smart1.webp' '01' 'https://www.101bananas.com/poems/smart.html'
          download_image 'https://humanimalia.org/public/journals/8/submission_9652_9653_coverImage_en_US.jpg' '02' 'https://humanimalia.org/article/view/9652'

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/jeoffry
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Import daily literary cat images: Jeoffry (2026-09-13)'
          git pull --rebase origin main
          git push origin HEAD:main
