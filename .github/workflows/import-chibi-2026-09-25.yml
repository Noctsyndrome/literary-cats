name: Import Chibi images (2026-09-25)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-chibi-2026-09-25.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-chibi-2026-09-25
  cancel-in-progress: false

jobs:
  import-images:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Remove temporary')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install browser-compatible HTTP client
        run: python -m pip install --quiet curl_cffi
      - name: Read public illustration image metadata
        shell: bash
        run: |
          python - <<'PY'
          import re
          from html import unescape
          from curl_cffi import requests
          url = 'https://creativepool.com/davidhoweillustration/projects/the-guest-cat'
          response = requests.get(url, impersonate='chrome', timeout=45)
          print('SOURCE_HTTP_STATUS', response.status_code)
          response.raise_for_status()
          html = response.text
          for tag in re.findall(r'<[^>]+>', html):
              if '/portfolio/' in tag or '1361198' in tag:
                  print('SOURCE_IMAGE_METADATA', unescape(tag), flush=True)
          for match in re.finditer(r'1361198', html):
              print('SOURCE_IMAGE_CONTEXT', html[max(0, match.start()-300):match.end()+600], flush=True)
          PY
