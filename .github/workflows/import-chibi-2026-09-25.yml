name: Import Chibi images (2026-09-25)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-chibi-2026-09-25.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-chibi-2026-09-25
  cancel-in-progress: false

jobs:
  import-images:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Remove temporary')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image validator
        run: python -m pip install --quiet Pillow
      - name: Download and verify the two replacement images
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import io
          import pathlib
          import time
          import urllib.request
          from PIL import Image

          target = pathlib.Path('assets/chibi')
          target.mkdir(parents=True, exist_ok=True)
          images = [
              ('01.jpg', 'https://www.kawade.co.jp/np/isbn/9784309409641/', [
                  'https://www.kawade.co.jp/img/cover_l/9784309409641.jpg'
              ]),
              ('02.jpg', 'https://creativepool.com/davidhoweillustration/projects/the-guest-cat', [
                  'https://s3.eu-west-2.amazonaws.com/img.creativepool.com/files/candidate/portfolio/1361198.jpg',
                  'https://s3.eu-west-2.amazonaws.com/img.creativepool.com/files/candidate/portfolio/_w680/1361198.jpg'
              ])
          ]
          for filename, referer, urls in images:
              errors = []
              for url in urls:
                  for attempt in range(2):
                      try:
                          request = urllib.request.Request(url, headers={
                              'User-Agent': 'Mozilla/5.0',
                              'Referer': referer,
                              'Accept': 'image/avif,image/webp,image/png,image/jpeg,image/*;q=0.8'
                          })
                          with urllib.request.urlopen(request, timeout=40) as response:
                              data = response.read(25 * 1024 * 1024 + 1)
                          if len(data) > 25 * 1024 * 1024:
                              raise ValueError('Image exceeds size limit')
                          with Image.open(io.BytesIO(data)) as im:
                              image_format, dimensions = im.format, im.size
                              im.verify()
                          with Image.open(io.BytesIO(data)) as im:
                              im.load()
                          if image_format != 'JPEG':
                              raise ValueError(f'Expected JPEG, received {image_format}')
                          if min(dimensions) < 300:
                              raise ValueError(f'Unexpected thumbnail dimensions: {dimensions}')
                          destination = target / filename
                          if destination.exists() and destination.read_bytes() != data:
                              raise RuntimeError(f'Refusing to overwrite existing different image: {destination}')
                          destination.write_bytes(data)
                          print(f'IMAGE_OK file={destination} url={url} format={image_format} dimensions={dimensions} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}', flush=True)
                          break
                      except Exception as error:
                          errors.append(f'{url}: {error}')
                          print(f'DOWNLOAD_RETRY {url}: {error}', flush=True)
                          time.sleep(2)
                  else:
                      continue
                  break
              else:
                  raise RuntimeError('\n'.join(errors))
          PY
      - name: Provide exact downloaded images for visual verification
        uses: actions/upload-artifact@v4
        with:
          name: chibi-2026-09-25-images
          path: assets/chibi/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Commit only verified Chibi image assets
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/chibi/01.jpg assets/chibi/02.jpg
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only | wc -l)" -le 2
          git commit -m 'Import literary cat images: Chibi (2026-09-25)'
          git pull --rebase origin main
          git push origin HEAD:main
