name: Import Chibi images (2026-09-25)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-chibi-2026-09-25.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-chibi-2026-09-25
  cancel-in-progress: false

jobs:
  import-images:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Remove temporary')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image validator
        run: python -m pip install --quiet Pillow
      - name: Download the two locked replacement images and validate their bytes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import io
          import pathlib
          import time
          import urllib.request
          from PIL import Image

          target = pathlib.Path('assets/chibi')
          target.mkdir(parents=True, exist_ok=True)
          images = [
              ('01.jpg', 'https://www.kawade.co.jp/np/isbn/9784309409641/',
               'https://www.kawade.co.jp/img/cover_l/9784309409641.jpg',
               '0d06209aaea57153903939936dd3f7e6182b054ed89349da7c2c0f2cf203c498'),
              ('02.jpg', 'https://creativepool.com/davidhoweillustration/projects/the-guest-cat',
               'https://s3.eu-west-2.amazonaws.com/img.creativepool.com/files/candidate/portfolio/full/1361204.jpg', None)
          ]
          for filename, referer, url, expected_hash in images:
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0',
                          'Referer': referer,
                          'Accept': 'image/jpeg,image/*;q=0.8'
                      })
                      with urllib.request.urlopen(request, timeout=40) as response:
                          data = response.read(25 * 1024 * 1024 + 1)
                      if len(data) > 25 * 1024 * 1024:
                          raise ValueError('Image exceeds size limit')
                      digest = hashlib.sha256(data).hexdigest()
                      if expected_hash and digest != expected_hash:
                          raise ValueError('Publisher cover differs from the verified image')
                      with Image.open(io.BytesIO(data)) as im:
                          image_format, dimensions = im.format, im.size
                          im.verify()
                      with Image.open(io.BytesIO(data)) as im:
                          im.load()
                      if image_format != 'JPEG':
                          raise ValueError(f'Expected JPEG, received {image_format}')
                      if filename == '01.jpg' and dimensions != (500, 714):
                          raise ValueError(f'Unexpected cover dimensions: {dimensions}')
                      if filename == '02.jpg' and (dimensions[0] < 700 or dimensions[1] < 1000):
                          raise ValueError(f'Illustration is smaller than the verified full-size source: {dimensions}')
                      destination = target / filename
                      if destination.exists() and destination.read_bytes() != data:
                          raise RuntimeError(f'Refusing to overwrite a different existing image: {destination}')
                      destination.write_bytes(data)
                      blob_sha = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
                      print(f'IMAGE_OK file={destination} url={url} format={image_format} dimensions={dimensions} bytes={len(data)} sha256={digest} git_blob_sha={blob_sha}', flush=True)
                      break
                  except Exception as error:
                      print(f'DOWNLOAD_RETRY {url}: {error}', flush=True)
                      if attempt == 2:
                          raise
                      time.sleep(2)
          PY
      - name: Retain exact downloaded images for verification
        uses: actions/upload-artifact@v4
        with:
          name: chibi-2026-09-25-final-images
          path: assets/chibi/*.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Commit only verified Chibi image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/chibi/01.jpg assets/chibi/02.jpg
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only | wc -l)" -le 2
          if git diff --cached --name-only | grep -Ev '^assets/chibi/0[12]\.jpg$'; then exit 1; fi
          git commit -m 'Import literary cat images: Chibi (2026-09-25)'
          git pull --rebase origin main
          git push origin HEAD:main
