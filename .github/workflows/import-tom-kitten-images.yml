name: Import Tom Kitten images

on:
  push:
    paths:
      - '.github/workflows/import-tom-kitten-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download visual references
        run: |
          set -euo pipefail
          mkdir -p assets/tom-kitten
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.gutenberg.org/cache/epub/14837/images/tom20.jpg' -o assets/tom-kitten/01.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.gutenberg.org/cache/epub/14837/images/tom28.jpg' -o assets/tom-kitten/02.jpg
          test -s assets/tom-kitten/01.jpg
          test -s assets/tom-kitten/02.jpg
      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tom-kitten
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Tom Kitten visual references'
            git push
          fi
