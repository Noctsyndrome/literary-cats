name: Import Mrs Norris images

on:
  push:
    paths:
      - '.github/workflows/import-mrs-norris.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          python - <<'PY'
          import pathlib
          import urllib.request

          out = pathlib.Path('assets/mrs-norris')
          out.mkdir(parents=True, exist_ok=True)
          items = [
              ('01.jpg', 'https://contentful.harrypotter.com/usf1vwtuqyxm/1V2TaZbK85XRReTih0baQX/c7c446cd49117befc39bdd8a1ade1eca/hp-f6-filch-mrs-norris-cropped-app-landscape.jpg?fit=pad&fm=jpg&h=416&q=75&w=600', 'https://www.harrypotter.com/fact-file/characters-and-pets/mrs-norris-fact-file'),
              ('02.jpg', 'https://contentful.harrypotter.com/usf1vwtuqyxm/6cyDtFMyFaGW48u6G62o44/f48bda84c984e13773c57779c6755cdc/ArgusFilch_WB_F1_FilchWithMrsNorrisCatchingHarryAndRon_9897.jpg?fm=jpg&q=75&w=914', 'https://www.harrypotter.com/features/in-defence-of-argus-filch'),
          ]
          for filename, url, referer in items:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': referer})
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = r.read()
                  ctype = r.headers.get_content_type()
              if len(data) < 1024 or not ctype.startswith('image/'):
                  raise RuntimeError(f'bad image {filename}: {len(data)} bytes {ctype}')
              (out / filename).write_bytes(data)
              print(filename, len(data), ctype)
          PY
      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mrs-norris
          git commit -m 'Archive Mrs Norris visual references'
          git push
