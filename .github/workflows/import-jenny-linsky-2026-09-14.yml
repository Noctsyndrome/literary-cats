name: Import Jenny Linsky images 2026-09-14

on:
  push:
    paths:
      - '.github/workflows/import-jenny-linsky-2026-09-14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download locked reference images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/jenny-linsky
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (GitHub Actions literary-cats image importer)' \
            -e 'https://www.nyrb.com/collections/esther-averill' \
            'https://www.nyrb.com/cdn/shop/products/jennyandthecatclub.jpg?v=1518198784' \
            -o assets/jenny-linsky/01.jpg
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (GitHub Actions literary-cats image importer)' \
            -e 'https://www.nyrb.com/collections/esther-averill' \
            'https://www.nyrb.com/cdn/shop/products/Jennys-Moonlight-Adventure.jpg?v=1518198783' \
            -o assets/jenny-linsky/02.jpg

      - name: Validate downloaded JPEG files
        shell: bash
        run: |
          set -euo pipefail
          file assets/jenny-linsky/01.jpg assets/jenny-linsky/02.jpg
          python3 - <<'PY'
          from pathlib import Path

          def jpeg_size(path):
              data = Path(path).read_bytes()
              if not data.startswith(b'\xff\xd8'):
                  raise SystemExit(f'{path}: not a JPEG')
              i = 2
              while i < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(data):
                      break
                  length = int.from_bytes(data[i:i+2], 'big')
                  if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                      if i + 7 > len(data):
                          break
                      height = int.from_bytes(data[i+3:i+5], 'big')
                      width = int.from_bytes(data[i+5:i+7], 'big')
                      return width, height, len(data)
                  i += length
              raise SystemExit(f'{path}: JPEG dimensions not found')

          for p in ['assets/jenny-linsky/01.jpg', 'assets/jenny-linsky/02.jpg']:
              w, h, n = jpeg_size(p)
              print(f'{p}: {w}x{h}, {n} bytes')
          PY

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/jenny-linsky/01.jpg assets/jenny-linsky/02.jpg
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Import Jenny Linsky reference images'
          git push
