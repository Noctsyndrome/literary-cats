name: Import Good Fortune visual references

on:
  push:
    paths:
      - '.github/workflows/import-good-fortune-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download visual references
        run: |
          set -euo pipefail
          mkdir -p assets/good-fortune

          curl --fail --location --retry 3 \
            -A 'Mozilla/5.0' \
            'https://www.gutenberg.org/cache/epub/78393/images/illus11.jpg' \
            -o assets/good-fortune/01.jpg

          curl --fail --location --retry 3 \
            -A 'Mozilla/5.0' \
            'https://www.gutenberg.org/cache/epub/78393/images/illus12.jpg' \
            -o assets/good-fortune/02.jpg

          test $(stat -c%s assets/good-fortune/01.jpg) -gt 1024
          test $(stat -c%s assets/good-fortune/02.jpg) -gt 1024

      - name: Commit visual references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/good-fortune/01.jpg assets/good-fortune/02.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Good Fortune visual references'
            git push
          fi
