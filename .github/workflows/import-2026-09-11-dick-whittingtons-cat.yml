name: Import daily cat images 2026-09-11

on:
  push:
    paths:
      - '.github/workflows/import-2026-09-11-dick-whittingtons-cat.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download locked visual references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/dick-whittingtons-cat

          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            --referer 'https://commons.wikimedia.org/wiki/File:Adventuresofwhit00newyiala_0007.jpg' \
            'https://upload.wikimedia.org/wikipedia/commons/4/47/Adventuresofwhit00newyiala_0007.jpg' \
            --output assets/dick-whittingtons-cat/01.jpg

          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            --referer 'https://www.oldbookillustrations.com/illustrations/rats-mice/' \
            'https://www.oldbookillustrations.com/site/assets/high-res/1922/rats-mice-1200.jpg' \
            --output assets/dick-whittingtons-cat/02.jpg

          test "$(wc -c < assets/dick-whittingtons-cat/01.jpg)" -gt 5000
          test "$(wc -c < assets/dick-whittingtons-cat/02.jpg)" -gt 5000
          file assets/dick-whittingtons-cat/01.jpg | grep -qi 'JPEG image data'
          file assets/dick-whittingtons-cat/02.jpg | grep -qi 'JPEG image data'

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dick-whittingtons-cat/01.jpg assets/dick-whittingtons-cat/02.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Import daily literary cat images: Dick Whittington's Cat"
            git push
          fi
