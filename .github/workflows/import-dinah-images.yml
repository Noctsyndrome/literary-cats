name: Import Dinah images

on:
  push:
    paths:
      - '.github/workflows/import-dinah-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download visual references
        run: |
          set -euo pipefail
          mkdir -p assets/dinah
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://upload.wikimedia.org/wikipedia/commons/2/2b/Dinah_and_kittens.JPG' -o assets/dinah/01.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://upload.wikimedia.org/wikipedia/commons/7/79/Alice-looking-glass-illustrated-by-blanche-mcmanus00001_05.jpg' -o assets/dinah/02.jpg
          test -s assets/dinah/01.jpg
          test -s assets/dinah/02.jpg
      - name: Commit image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dinah
          if ! git diff --cached --quiet; then
            git commit -m 'Add Dinah visual assets'
            git push
          fi
