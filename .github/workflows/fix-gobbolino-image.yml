name: Fix Gobbolino high-res image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-gobbolino-image.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace Gobbolino image with high-resolution source
        env:
          IMAGE_URL: https://countryhouselibrary.co.uk/cdn/shop/products/orig_253568_jpg_1200x.jpg?v=1681829943
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent 'Mozilla/5.0' \
            "$IMAGE_URL" \
            --output assets/gobbolino/02.jpg
          test "$(stat -c%s assets/gobbolino/02.jpg)" -gt 20000
          file assets/gobbolino/02.jpg

      - name: Update visual source record
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('entries/2026-09-12-gobbolino.md')
          old = 'https://countryhouselibrary.co.uk/cdn/shop/products/orig_253568_jpg_small.jpg?v=1681829943'
          new = 'https://countryhouselibrary.co.uk/cdn/shop/products/orig_253568_jpg_1200x.jpg?v=1681829943'
          text = p.read_text(encoding='utf-8')
          if old not in text:
              raise SystemExit('expected small-image URL not found in entry')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-gobbolino-image.yml

      - name: Commit and push correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gobbolino/02.jpg entries/2026-09-12-gobbolino.md .github/workflows/fix-gobbolino-image.yml
          git commit -m 'Fix Gobbolino high-resolution reference image'
          git push

      - name: Trigger production build and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main
