name: Import Coraline cat images

on:
  push:
    paths:
      - '.github/workflows/import-coraline-cat-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download visual references
        run: |
          set -euo pipefail
          mkdir -p assets/coraline-cat
          curl -L --fail --retry 2 -A 'Mozilla/5.0' \
            'https://i.imgur.com/eZNQGVpg.jpg' \
            -o assets/coraline-cat/01.jpg
          curl -L --fail --retry 2 -A 'Mozilla/5.0' \
            'https://i.pinimg.com/736x/2a/4e/a7/2a4ea7fa5a21d9e1c0dba6099f306f4e.jpg' \
            -o assets/coraline-cat/02.jpg
          test $(wc -c < assets/coraline-cat/01.jpg) -gt 1000
          test $(wc -c < assets/coraline-cat/02.jpg) -gt 1000
      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/coraline-cat
          git commit -m 'Archive Coraline cat visual references'
          git push
