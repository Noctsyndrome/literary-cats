name: Replace White Cat images

on:
  push:
    paths:
      - '.github/workflows/replace-white-cat-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download visual references
        run: |
          set -euo pipefail
          mkdir -p assets/white-cat
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://www.xn--forlst-sua.dk/sites/default/files/2022/katte1.03.jpg' -o assets/white-cat/01.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://mflibra.com/cdn/shop/products/20220408white-015_grande.jpg?v=1649441771' -o assets/white-cat/02.jpg
          test -s assets/white-cat/01.jpg
          test -s assets/white-cat/02.jpg
      - name: Commit visual references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/white-cat
          if ! git diff --cached --quiet; then
            git commit -m 'Use representative White Cat visual references'
            git push
          fi
