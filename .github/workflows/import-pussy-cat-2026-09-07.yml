name: Import Pussy-cat visual references 2026-09-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pussy-cat-2026-09-07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download visual references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pussy-cat
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' \
            'https://s3.eu-west-2.amazonaws.com/grpl-mylearning/resources/4PgC5tZZw8zBz6JTdXRJmgLbho3Hg2GStTsHq2Rq.jpeg' \
            -o assets/pussy-cat/01.jpeg
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' \
            'https://i.guim.co.uk/img/media/a3f53cbbabfc2db0702ca25c2b2e4ccf5287029f/0_15_1356_1244/master/1356.jpg?crop=none&dpr=1&s=none&width=445' \
            -o assets/pussy-cat/02.jpg

      - name: Validate downloaded images
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/pussy-cat/01.jpeg
          test -s assets/pussy-cat/02.jpg
          file assets/pussy-cat/01.jpeg assets/pussy-cat/02.jpg
          file --mime-type -b assets/pussy-cat/01.jpeg | grep -Eq '^image/(jpeg|jpg)$'
          file --mime-type -b assets/pussy-cat/02.jpg | grep -Eq '^image/(jpeg|jpg)$'

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pussy-cat/01.jpeg assets/pussy-cat/02.jpg
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Import Pussy-cat visual references 2026-09-07'
          git push
