name: Import Church visual assets

on:
  push:
    paths:
      - '.github/workflows/import-church-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Church reference images
        run: |
          set -euo pipefail
          mkdir -p assets/church
          python - <<'PY'
          import pathlib, urllib.request

          items = [
              (
                  'https://stopklatka.pl/wp-content/uploads/2021/02/smetarz-dla-zwierzakow-tajemnice-kultowego-horroru.jpg',
                  'assets/church/01.jpg',
                  'https://stopklatka.pl/aktualnosci-filmowe/smetarz-dla-zwierzakow-tajemnice-kultowego-horroru'
              ),
              (
                  'https://www.syfy.com/sites/syfy/files/2019/04/pet_sematary_church_vs_ellie.jpg',
                  'assets/church/02.jpg',
                  'https://www.syfy.com/syfy-wire/the-pet-sematary-screenwriter-explains-why-they-made-those-big-changes'
              ),
          ]

          for url, out, referer in items:
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
                  'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
                  'Referer': referer,
              })
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = r.read()
              if len(data) < 10000:
                  raise RuntimeError(f'{url} returned only {len(data)} bytes')
              pathlib.Path(out).write_bytes(data)
              print(out, len(data))
          PY
      - name: Commit image assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/church
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Church reference images'
            git push
          fi
