name: Verify workflow access 2026-09-26

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-workflow-access-2026-09-26.yml'

permissions: {}

jobs:
  verify:
    name: Harmless workflow access check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm runner execution
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'workflow-access-probe-ok'
