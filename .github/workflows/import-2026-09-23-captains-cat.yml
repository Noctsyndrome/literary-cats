name: Import daily literary cat images 2026-09-23

on:
  push:
    paths:
      - '.github/workflows/import-2026-09-23-captains-cat.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download locked reference images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/the-captains-cat
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/7/71/The_Cat_and_the_Captain_%281927%29_frontispiece.png' \
            -o assets/the-captains-cat/01.png
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://upload.wikimedia.org/wikipedia/commons/d/d8/The_Cat_and_the_Captain_%281927%29_7.png' \
            -o assets/the-captains-cat/02.png

      - name: Validate downloaded PNG files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              Path('assets/the-captains-cat/01.png'): (933, 1209),
              Path('assets/the-captains-cat/02.png'): (1047, 1260),
          }
          for path, dims in expected.items():
              data = path.read_bytes()
              if len(data) < 24 or data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path} is not a valid PNG')
              width, height = struct.unpack('>II', data[16:24])
              if (width, height) != dims:
                  raise SystemExit(f'{path} dimensions {(width, height)} != expected {dims}')
              if len(data) < 100_000:
                  raise SystemExit(f'{path} is unexpectedly small: {len(data)} bytes')
              print(f'{path}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/the-captains-cat/01.png assets/the-captains-cat/02.png
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m "Import daily literary cat images: The Captain's Cat"
          git push
