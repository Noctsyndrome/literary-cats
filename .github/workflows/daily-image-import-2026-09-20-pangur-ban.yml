name: Import daily literary cat images - Pangur Ban

on:
  push:
    paths:
      - '.github/workflows/daily-image-import-2026-09-20-pangur-ban.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download locked visual references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pangur-ban

          download() {
            local url="$1"
            local out="$2"
            local referer="$3"
            curl --fail --location --retry 4 --retry-all-errors \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
              -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' \
              -e "$referer" \
              "$url" -o "$out"
            test -s "$out"
            file "$out"
          }

          download \
            'https://images.squarespace-cdn.com/content/v1/5a0dec38aeb6250b51582f71/1603374510624-X967UE3SD3OI2XU2UBF0/White%2BCat%2Band%2Bthe%2BMonk%2B1.jpg?format=2500w' \
            'assets/pangur-ban/01.webp' \
            'https://www.sydneydraws.ca/the-white-cat-and-the-monk'

          download \
            'https://images.squarespace-cdn.com/content/v1/5a0dec38aeb6250b51582f71/1603374512473-QEJD3080GH0ZQH3LW4HO/White%2BCat%2Band%2Bthe%2BMonk%2B2.jpg?format=2500w' \
            'assets/pangur-ban/02.webp' \
            'https://www.sydneydraws.ca/the-white-cat-and-the-monk'

          python3 - <<'PY'
          from pathlib import Path
          import struct

          def webp_size(path):
              data = Path(path).read_bytes()
              if len(data) < 30 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'{path}: not a WebP image')
              chunk = data[12:16]
              if chunk == b'VP8X':
                  w = 1 + int.from_bytes(data[24:27], 'little')
                  h = 1 + int.from_bytes(data[27:30], 'little')
                  return w, h
              if chunk == b'VP8 ':
                  payload = data[20:]
                  sig = payload.find(b'\x9d\x01\x2a')
                  if sig < 0 or sig + 7 > len(payload):
                      raise SystemExit(f'{path}: VP8 dimensions not found')
                  w = struct.unpack('<H', payload[sig+3:sig+5])[0] & 0x3FFF
                  h = struct.unpack('<H', payload[sig+5:sig+7])[0] & 0x3FFF
                  return w, h
              if chunk == b'VP8L':
                  payload = data[20:25]
                  if len(payload) < 5 or payload[0] != 0x2F:
                      raise SystemExit(f'{path}: VP8L dimensions not found')
                  b0, b1, b2, b3 = payload[1:5]
                  w = 1 + b0 + ((b1 & 0x3F) << 8)
                  h = 1 + ((b1 & 0xC0) >> 6) + (b2 << 2) + ((b3 & 0x0F) << 10)
                  return w, h
              raise SystemExit(f'{path}: unsupported WebP chunk {chunk!r}')

          for p in ['assets/pangur-ban/01.webp', 'assets/pangur-ban/02.webp']:
              w, h = webp_size(p)
              size = Path(p).stat().st_size
              print(f'{p}: {w}x{h}, {size} bytes')
              if w < 400 or h < 300 or size < 25000:
                  raise SystemExit(f'{p}: image appears to be an unusably small derivative')
          PY

      - name: Commit archived images only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pangur-ban/01.webp assets/pangur-ban/02.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Archive daily literary cat images: Pangur Ban'
            git push
          fi
