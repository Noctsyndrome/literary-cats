name: Import Slinky Malinki images 2026-09-16

on:
  push:
    paths:
      - '.github/workflows/import-slinky-malinki-2026-09-16.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download locked visual references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/slinky-malinki

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -e 'https://www.wodonga.vic.gov.au/newsroom/archive/calling-all-hairy-maclary-fans' \
            'https://www.wodonga.vic.gov.au/Portals/0/GravityImages/4980/crop/SlinkyMalinki_28x1920x1080.jpg' \
            -o assets/slinky-malinki/01.jpg

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -e 'https://www.tartanplustweed.com/products/slinky-malinky-cat-flaps' \
            'https://www.tartanplustweed.com/cdn/shop/files/Slinky_Malinky_Catflaps_Book_1200x1200.jpg?v=1741360992' \
            -o assets/slinky-malinki/02.jpg

      - name: Validate downloaded images
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/slinky-malinki/01.jpg assets/slinky-malinki/02.jpg; do
            test -s "$f"
            test "$(stat -c%s "$f")" -gt 50000
            file "$f"
          done
          python - <<'PY'
          from pathlib import Path
          import struct

          def jpeg_size(path):
              data = Path(path).read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise SystemExit(f'{path}: not JPEG')
              i = 2
              while i < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  length = struct.unpack('>H', data[i:i+2])[0]
                  if marker in range(0xC0, 0xC4):
                      h, w = struct.unpack('>HH', data[i+3:i+7])
                      return w, h
                  i += length
              raise SystemExit(f'{path}: no JPEG size marker')

          for path in ['assets/slinky-malinki/01.jpg', 'assets/slinky-malinki/02.jpg']:
              w, h = jpeg_size(path)
              print(f'{path}: {w}x{h}')
              if min(w, h) < 700:
                  raise SystemExit(f'{path}: unexpectedly low resolution')
          PY

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/slinky-malinki/01.jpg assets/slinky-malinki/02.jpg
          if git diff --cached --quiet; then
            echo 'Locked images already present with identical content.'
          else
            git commit -m 'Import Slinky Malinki visual references'
            git push
          fi
