name: Import Tibert images 2026-09-09

on:
  push:
    paths:
      - '.github/workflows/import-tibert-2026-09-09.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download locked visual references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/tibert

          curl -L --fail --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 literary-cats-image-import' \
            'https://www.oldbookillustrations.com/site/assets/files/13537/towards-malepartus.jpg' \
            -o assets/tibert/01.jpg

          curl -L --fail --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 literary-cats-image-import' \
            -e 'https://etc.usf.edu/clipart/71900/71949/71949_rey_tibert.htm' \
            'https://etc.usf.edu/clipart/71900/71949/71949_rey_tibert_lg.gif' \
            -o assets/tibert/02.gif

          test -s assets/tibert/01.jpg
          test -s assets/tibert/02.gif
          file assets/tibert/01.jpg | grep -qi 'JPEG image data'
          file assets/tibert/02.gif | grep -qi 'GIF image data'

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tibert/01.jpg assets/tibert/02.gif
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Import literary cat images: Tibert (2026-09-09)'
          git push
