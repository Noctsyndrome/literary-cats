name: Import White Cat images

on:
  push:
    paths:
      - '.github/workflows/import-white-cat-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download visual references
        run: |
          set -euo pipefail
          mkdir -p assets/white-cat
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://upload.wikimedia.org/wikipedia/commons/e/e7/Madame_d%27Aulnoy_-_John_Gilbert_-_The_White_Cat.jpg' -o assets/white-cat/01.jpg
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://upload.wikimedia.org/wikipedia/commons/7/75/Gaillard_-_Monde_enchante_illustration_p215.jpg' -o assets/white-cat/02.jpg
          test -s assets/white-cat/01.jpg
          test -s assets/white-cat/02.jpg
      - name: Commit visual references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/white-cat
          if ! git diff --cached --quiet; then
            git commit -m 'Archive White Cat visual references'
            git push
          fi
