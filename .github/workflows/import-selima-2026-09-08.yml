name: Import daily literary cat images - Selima 2026-09-08

on:
  push:
    paths:
      - '.github/workflows/import-selima-2026-09-08.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download locked visual references
        run: |
          python - <<'PY'
          import pathlib
          import urllib.request

          assets = pathlib.Path('assets/selima')
          assets.mkdir(parents=True, exist_ok=True)

          images = [
              {
                  'path': assets / '01.jpg',
                  'url': 'https://arthive.com/res/media/img/oy1000/work/c43/472513%402x.jpg',
                  'referer': 'https://arthive.com/williamblake/works/500006~Illustrations_to_the_poems_Ode_on_the_death_of_a_beloved_cat_Sheet_3_the_beginning_of_the_poem',
              },
              {
                  'path': assets / '02.jpg',
                  'url': 'https://s.hdnux.com/photos/01/54/31/47/28416506/5/1920x0.jpg',
                  'referer': 'https://www.ctinsider.com/living/article/new-haven-yale-william-blake-21019911.php',
              },
          ]

          for image in images:
              req = urllib.request.Request(
                  image['url'],
                  headers={
                      'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
                      'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
                      'Referer': image['referer'],
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
                  ctype = (response.headers.get('Content-Type') or '').lower()
              if len(data) < 5000:
                  raise RuntimeError(f"{image['url']} returned only {len(data)} bytes")
              if not data.startswith(b'\xff\xd8\xff'):
                  raise RuntimeError(f"{image['url']} is not a JPEG; Content-Type={ctype}")
              image['path'].write_bytes(data)
              print(f"saved {image['path']} ({len(data)} bytes, {ctype})")
          PY
      - name: Commit locked visual references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/selima/01.jpg assets/selima/02.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Import daily literary cat images: Selima'
            git push
          fi
