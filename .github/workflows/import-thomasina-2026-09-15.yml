name: Import Thomasina locked images

on:
  push:
    paths:
      - '.github/workflows/import-thomasina-2026-09-15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download locked visual references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/thomasina

          curl --fail --location --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            -H 'Accept: image/jpeg,*/*;q=0.8' \
            -e 'https://www.nyrb.com/products/thomasina-1' \
            'https://www.nyrb.com/cdn/shop/products/Thomasina_final.jpg?v=1671233084' \
            -o assets/thomasina/01.jpg

          curl --fail --location --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            -H 'Accept: image/png,*/*;q=0.8' \
            -e 'https://myliveactiondisneyproject.com/2017/07/24/the-three-lives-of-thomasina-1964/' \
            'https://myliveactiondisneyproject.com/wp-content/uploads/2017/07/thomasinacat.png?w=1024' \
            -o assets/thomasina/02.png

          test "$(file -b --mime-type assets/thomasina/01.jpg)" = 'image/jpeg'
          test "$(file -b --mime-type assets/thomasina/02.png)" = 'image/png'
          test "$(stat -c%s assets/thomasina/01.jpg)" -gt 1024
          test "$(stat -c%s assets/thomasina/02.png)" -gt 1024

          echo 'Image validation:'
          file assets/thomasina/01.jpg
          file assets/thomasina/02.png
          stat -c '%n: %s bytes' assets/thomasina/01.jpg assets/thomasina/02.png

      - name: Commit locked images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/thomasina/01.jpg assets/thomasina/02.png
          if ! git diff --cached --quiet; then
            git commit -m 'Import locked images for Thomasina'
            git push
          fi
