name: Import daily literary cat images - Koko

on:
  push:
    paths:
      - '.github/workflows/daily-image-import-2026-09-22-koko.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download locked visual references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/koko

          download() {
            local url="$1"
            local out="$2"
            local referer="$3"
            curl --fail --location --retry 4 --retry-all-errors \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
              -H 'Accept: image/jpeg,image/png,image/*;q=0.8,*/*;q=0.5' \
              -e "$referer" \
              "$url" -o "$out"
            test -s "$out"
            file "$out"
          }

          download \
            'https://is1-ssl.mzstatic.com/image/thumb/Publication211/v4/b8/ea/4c/b8ea4c82-e443-46e9-2ec7-31ff6ef1163f/9781101215166.d.jpg/1200x900wz.jpg' \
            'assets/koko/01.jpg' \
            'https://books.apple.com/us/book/the-cat-who-could-read-backwards/id361932485'

          download \
            'https://pictures.abebooks.com/inventory/32284285168.jpg' \
            'assets/koko/02.jpg' \
            'https://www.abebooks.com/first-edition/Cat-Who-Read-Backwards-Braun-Lilian/32284285168/bd'

          python3 - <<'PY'
          from pathlib import Path
          import struct

          def jpeg_size(path):
              data = Path(path).read_bytes()
              if not data.startswith(b'\xff\xd8'):
                  raise SystemExit(f'{path}: not a JPEG')
              i = 2
              while i + 9 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  marker = data[i+1]
                  i += 2
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(data):
                      break
                  seglen = struct.unpack('>H', data[i:i+2])[0]
                  if marker in (0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF):
                      h, w = struct.unpack('>HH', data[i+3:i+7])
                      return w, h
                  i += seglen
              raise SystemExit(f'{path}: dimensions not found')

          for p in ['assets/koko/01.jpg', 'assets/koko/02.jpg']:
              w, h = jpeg_size(p)
              size = Path(p).stat().st_size
              print(f'{p}: {w}x{h}, {size} bytes')
          PY

          sha256sum assets/koko/01.jpg assets/koko/02.jpg

      - name: Commit archived images only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/koko/01.jpg assets/koko/02.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Archive daily literary cat images: Koko'
            git push
          fi
