name: Import Mehitabel images 2026-09-17

on:
  push:
    paths:
      - '.github/workflows/import-mehitabel-2026-09-17.yml'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download locked visual references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/mehitabel

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -e 'https://www.abebooks.com/Archy-Mehitabel-Marquis-Don-Doubleday-Doran/31929588100/bd' \
            'https://pictures.abebooks.com/inventory/31929588100.jpg' \
            -o assets/mehitabel/01.jpg

          curl --fail --location --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -e 'https://www.zvab.com/erstausgabe/Archys-Life-Mehitabel-Marquis-Don-Doubleday/31430696399/bd' \
            'https://pictures.abebooks.com/inventory/31430696399.jpg' \
            -o assets/mehitabel/02.jpg

      - name: Validate downloaded images
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/mehitabel/01.jpg assets/mehitabel/02.jpg; do
            test -s "$f"
            test "$(stat -c%s "$f")" -gt 40000
            file "$f"
          done
          python - <<'PY'
          from pathlib import Path
          import struct

          def jpeg_size(path):
              data = Path(path).read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise SystemExit(f'{path}: not JPEG')
              i = 2
              while i + 9 < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  if i >= len(data):
                      break
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9) or 0xD0 <= marker <= 0xD7:
                      continue
                  if i + 2 > len(data):
                      break
                  length = struct.unpack('>H', data[i:i+2])[0]
                  if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                      h, w = struct.unpack('>HH', data[i+3:i+7])
                      return w, h
                  i += length
              raise SystemExit(f'{path}: no JPEG size marker')

          expected = {
              'assets/mehitabel/01.jpg': (650, 900),
              'assets/mehitabel/02.jpg': (650, 800),
          }
          for path, (min_w, min_h) in expected.items():
              w, h = jpeg_size(path)
              print(f'{path}: {w}x{h}')
              if w < min_w or h < min_h:
                  raise SystemExit(f'{path}: downloaded image is smaller than the inspected source version')
          PY

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mehitabel/01.jpg assets/mehitabel/02.jpg
          if git diff --cached --quiet; then
            echo 'Locked images already present with identical content.'
          else
            git commit -m 'Import Mehitabel visual references'
            git push
          fi
