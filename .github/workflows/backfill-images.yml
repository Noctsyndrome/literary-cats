name: Backfill literary cat images

on:
  push:
    paths:
      - 'data/image-backfill.json'
      - '.github/workflows/backfill-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images and update entries
        run: |
          python - <<'PY'
          import json, pathlib, re, urllib.request, urllib.error

          root = pathlib.Path('.')
          manifest = json.loads((root / 'data/image-backfill.json').read_text(encoding='utf-8'))
          errors = []

          def download(url, source_page):
              headers = {
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
                  'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              }
              if source_page:
                  headers['Referer'] = source_page
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = r.read()
                  ctype = (r.headers.get_content_type() or '').lower()
              if len(data) < 1024:
                  raise RuntimeError(f'download too small: {len(data)} bytes')
              if ctype == 'image/png': ext = '.png'
              elif ctype == 'image/webp': ext = '.webp'
              elif ctype in ('image/jpeg', 'image/jpg'): ext = '.jpg'
              elif '.png' in url.lower(): ext = '.png'
              elif '.webp' in url.lower(): ext = '.webp'
              else: ext = '.jpg'
              return data, ext

          for entry in manifest['entries']:
              slug = entry['slug']
              md_path = root / entry['entry_path']
              if not md_path.exists():
                  errors.append(f'{slug}: missing entry {md_path}')
                  continue
              original = md_path.read_text(encoding='utf-8')
              body = re.split(r'\n### 视觉参考\n', original, maxsplit=1)[0].rstrip()
              # Remove any previously inserted image block directly beneath the H1 title.
              lines = body.splitlines()
              if not lines or not lines[0].startswith('# '):
                  errors.append(f'{slug}: malformed title')
                  continue
              title = lines[0]
              rest = '\n'.join(lines[1:]).lstrip('\n')
              rest = re.sub(r'^(?:!\[[^\]]*\]\([^\n]+\)\s*){1,3}\n*', '', rest)

              asset_dir = root / 'assets' / slug
              asset_dir.mkdir(parents=True, exist_ok=True)
              local_refs = []
              provenance = []

              for idx, image in enumerate(entry['images'], start=1):
                  success = False
                  last_error = None
                  for url in image.get('image_urls', []):
                      try:
                          data, ext = download(url, image.get('source_page', ''))
                          filename = f'{idx:02d}{ext}'
                          # Remove old same-index files with a different extension.
                          for old in asset_dir.glob(f'{idx:02d}.*'):
                              old.unlink()
                          (asset_dir / filename).write_bytes(data)
                          local_refs.append((image['caption'], f'../assets/{slug}/{filename}'))
                          provenance.append((image, url))
                          success = True
                          break
                      except Exception as exc:
                          last_error = exc
                  if not success:
                      errors.append(f'{slug} image {idx}: {last_error}')

              if not local_refs:
                  continue

              image_block = '\n'.join(f'![{caption}]({path})' for caption, path in local_refs)
              refs = ['### 视觉参考', '']
              for i, ((caption, rel), (image, used_url)) in enumerate(zip(local_refs, provenance), start=1):
                  refs.append(f'{i}. {caption}')
                  refs.append(f'   - 本地文件：`{rel}`')
                  refs.append(f"   - 来源页面：{image.get('source_page','')}")
                  refs.append(f'   - 原始图片：{used_url}')
                  if image.get('credit'):
                      refs.append(f"   - 作者/机构：{image['credit']}")
                  if image.get('note'):
                      refs.append(f"   - 说明：{image['note']}")
              final = f'{title}\n\n{image_block}\n\n{rest.rstrip()}\n\n' + '\n'.join(refs) + '\n'
              md_path.write_text(final, encoding='utf-8')

          if errors:
              (root / 'data/image-backfill-errors.txt').write_text('\n'.join(errors) + '\n', encoding='utf-8')
              print('Backfill completed with errors:')
              print('\n'.join(errors))
          else:
              p = root / 'data/image-backfill-errors.txt'
              if p.exists(): p.unlink()
              print('Backfill completed with no errors.')
          PY
      - name: Commit archived images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets entries data/image-backfill-errors.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'Backfill local image assets for historical entries'
            git push
          fi
